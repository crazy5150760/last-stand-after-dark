name: Verify modular browser project
on:
  push:
    branches: [main, 'alpha-*', 'refactor/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run doctor
      - run: npm run check
      - run: npm run build
      - run: npm run build:check
      - name: Install pinned optional browser test tooling
        run: npm run setup:browser
      - name: Install Chromium system libraries
        run: npx playwright install-deps chromium
      - name: Real browser launch, mobile touch and offline checks
        run: npm run test:browser
      - name: Full gameplay, offline and preservation regressions
        run: npm test
      - name: Package verified browser output
        run: python3 tools/package_web_preview.py --output "$RUNNER_TEMP/last-stand-release"
      - name: Retain build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-stand-validation-${{ github.sha }}
          path: |
            web-dist/
            test-results/
            ${{ runner.temp }}/last-stand-release/
          if-no-files-found: warn
          retention-days: 14
