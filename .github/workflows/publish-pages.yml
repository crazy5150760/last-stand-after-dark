# Manual only. Existing Pages source remains gh-pages/(root); no domain change.
name: Publish verified game to existing Pages branch
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Reviewed source commit SHA (40 hex characters)'
        required: true
        type: string
      expected_live_commit:
        description: 'Current gh-pages commit SHA; reject a changed live baseline'
        required: true
        type: string
      publish_verified_build:
        description: 'Publish after Android acceptance; false runs verification only'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: last-stand-pages-production
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require immutable commit identifiers before checkout
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
          LIVE_SHA: ${{ inputs.expected_live_commit }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Confirm the exact source checkout
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate
      - run: npm run setup:browser
      - run: npx playwright install-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pages-output
          path: web-dist/
          if-no-files-found: error
      - name: Record verification and publication mode
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
          LIVE_SHA: ${{ inputs.expected_live_commit }}
          PUBLISH_REQUESTED: ${{ inputs.publish_verified_build }}
        run: |
          {
            echo '### Pages candidate verification passed'
            echo "Source: $SOURCE_SHA"
            echo "Expected live branch: $LIVE_SHA"
            if [ "$PUBLISH_REQUESTED" = 'true' ]; then
              echo 'Publication requested; the separate protected publish job must still succeed.'
            else
              echo 'Verification only. No publishing identity was used and no live files were changed.'
              echo 'The expected live SHA was validated as input, but live branch equality is checked only by the publish job.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: verify
    if: ${{ inputs.publish_verified_build == true }}
    runs-on: ubuntu-latest
    environment: pages-production
    permissions:
      contents: read
    steps:
      - name: Require the configured Pages publishing identity
        env:
          PUBLISH_TOKEN: ${{ secrets.PAGES_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo 'Configure PAGES_PUBLISH_TOKEN with repository Contents write permission. GITHUB_TOKEN branch pushes do not trigger the native Pages build.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.PAGES_PUBLISH_TOKEN }}
      - name: Verify live branch has not changed
        env:
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: verified-pages-output
          path: ${{ runner.temp }}/verified-game
      - name: Commit generated files without removing existing content or CNAME
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'verified-game'
          allowed = {'index.html', 'manifest.webmanifest', 'sw.js', 'install/index.html', 'install.js', 'install.css', 'icons/icon-192.png', 'icons/icon-512.png', 'icons/maskable-512.png', '_headers', 'build-info.json'}
          assert not any(p.is_symlink() for p in source.rglob('*'))
          assert {p.relative_to(source).as_posix() for p in source.rglob('*') if p.is_file()} == allowed
          info = json.loads((source / 'build-info.json').read_text())
          for entry in info['cacheAssets']:
              name = 'install/index.html' if entry['key'] == 'install/' else entry['key']
              assert name in allowed
              assert hashlib.sha256((source / name).read_bytes()).hexdigest() == entry['sha256']
          for name in sorted(allowed):
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source / name, target)
          PYCODE
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html manifest.webmanifest sw.js install/ install.js install.css icons/ _headers build-info.json .nojekyll
          if git diff --cached --quiet; then
            echo 'Production output already matches; no publication needed.'
          else
            git commit -m "Publish verified source $SOURCE_SHA"
            git push origin HEAD:gh-pages
          fi
