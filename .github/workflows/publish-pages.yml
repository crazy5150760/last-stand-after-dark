name: Release verified game with GitHub Pages
on:
  push:
    branches: [main]
    paths: ['deployment/pages-release.json', '.github/workflows/publish-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: last-stand-pages-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      expected_live_commit: ${{ steps.release.outputs.expected_live_commit }}
      expected_build: ${{ steps.release.outputs.expected_build }}
      expected_game_sha256: ${{ steps.release.outputs.expected_game_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: automation/.nvmrc
      - name: Validate the reviewed release request
        id: release
        run: node automation/scripts/pages-release.cjs config automation/deployment/pages-release.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          path: candidate
          persist-credentials: false
      - name: Confirm immutable source checkout
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_ref }}
        run: test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: candidate
      - run: npm run doctor
        working-directory: candidate
      - run: npm run validate
        working-directory: candidate
      - run: npm run setup:browser
        working-directory: candidate
      - run: npx playwright install-deps chromium
        working-directory: candidate
      - run: npm run test:browser
        working-directory: candidate
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: current-site
          persist-credentials: false
      - name: Check the preserved site baseline
        env:
          LIVE_SHA: ${{ steps.release.outputs.expected_live_commit }}
        run: test "$(git -C current-site rev-parse HEAD)" = "$LIVE_SHA"
      - name: Compose the exact game while preserving CNAME and existing content
        run: node automation/scripts/pages-release.cjs compose automation/deployment/pages-release.json current-site candidate/web-dist "$RUNNER_TEMP/pages-site"
      - name: Package the verified Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - name: Record rehearsal result
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          if [ "$PUBLISH" = 'true' ]; then
            echo 'Verified artifact ready. The separate Pages deployment must still succeed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Rehearsal passed. No deployment, credential setup or live-site change performed.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: verify
    if: ${{ needs.verify.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck the site baseline immediately before deployment
        uses: actions/github-script@v7
        env:
          EXPECTED: ${{ needs.verify.outputs.expected_live_commit }}
        with:
          script: |
            const {data} = await github.rest.git.getRef({...context.repo, ref: 'heads/gh-pages'});
            if (data.object.sha !== process.env.EXPECTED) throw new Error('Preserved site baseline changed; review before publishing.');
      - name: Deploy using GitHub's built-in identity
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public game and every cached asset
        uses: actions/github-script@v7
        env:
          EXPECTED_BUILD: ${{ needs.verify.outputs.expected_build }}
          EXPECTED_GAME: ${{ needs.verify.outputs.expected_game_sha256 }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            const base = new URL('https://crazy5150760.github.io/last-stand-after-dark/');
            const fresh = url => {const u = new URL(url, base); if (u.origin !== base.origin || !u.pathname.startsWith(base.pathname)) throw new Error('Unexpected asset URL'); u.searchParams.set('release-check', String(context.runId)); return u;};
            let info;
            for (let attempt = 0; attempt < 8; attempt++) {
              try {
                const r = await fetch(fresh('build-info.json'), {cache: 'no-store', signal: AbortSignal.timeout(8000)});
                if (!r.ok) throw new Error('Build metadata HTTP ' + r.status);
                const data = await r.json();
                if (data.build === process.env.EXPECTED_BUILD && data.standaloneSha256 === process.env.EXPECTED_GAME) {info = data; break;}
              } catch (error) {core.info('Waiting for matching public metadata: ' + error.message);}
              await new Promise(resolve => setTimeout(resolve, 2500));
            }
            if (!info || !Array.isArray(info.cacheAssets) || info.cacheAssets.length !== 8) throw new Error('The public build did not match the verified release');
            for (const asset of info.cacheAssets) {
              const r = await fetch(fresh(asset.url), {cache: 'no-store', signal: AbortSignal.timeout(10000)});
              if (!r.ok) throw new Error('Asset HTTP ' + r.status + ': ' + asset.key);
              const actual = createHash('sha256').update(Buffer.from(await r.arrayBuffer())).digest('hex');
              if (actual !== asset.sha256) throw new Error('Public asset hash mismatch: ' + asset.key);
            }
            core.info('Public game verified: ' + info.version + ' / ' + info.build);
